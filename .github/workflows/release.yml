name: release version

on:
  push:
    branches:
      - main

# A single merge can be delivered as more than one push event. Serialize release runs so they
# don't race on release:prepare and push to main at the same time.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    steps:
      - uses: actions/checkout@v6

      # A queued run can start after an earlier run has already released and pushed to main.
      # Releasing from this commit again would fail at the push, so skip when main has moved on.
      - name: Check main is still at this commit
        id: head
        run: |
          remote_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "main is at $remote_sha, not $GITHUB_SHA; skipping release"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        if: steps.head.outputs.stale != 'true'
        uses: qcastel/github-actions-maven-release@master
        with:
          release-branch-name: "main"
          version-minor: true

          git-release-bot-name: "phasetwo-bot"
          git-release-bot-email: "support@phasetwo.io"

          maven-args: "-B -Dmaven.test.skip=true -DskipITs -Dmaven.deploy.skip=true -Dspotless.check.skip=true"

          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

          gpg-enabled: true
          gpg-key-id: BC6B4EADEB514AFD
          gpg-key: ${{ secrets.GPG_KEY }}

          docker-registry-id: ossrh
          docker-registry-username: ${{ secrets.OSSRH_USERNAME }}
          docker-registry-password: ${{ secrets.OSSRH_PASSWORD }}

          maven-development-version-number: ${parsedVersion.majorVersion}.${parsedVersion.nextMinorVersion}-SNAPSHOT
          maven-release-version-number: ${parsedVersion.majorVersion}.${parsedVersion.minorVersion}
