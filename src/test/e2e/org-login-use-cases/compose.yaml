name: orgtest
services:
  keycloak:
    build:
      context: .
      args:
        KC_IMAGE: ${KC_IMAGE:-quay.io/phasetwo/phasetwo-keycloak:26.8.2}
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: "9001"
      KC_HTTP_PORT: "8081"
      KC_HOSTNAME: "http://localhost:8081"
      KC_LOG_LEVEL: "INFO,io.phasetwo:DEBUG"
    ports:
      - "8081:8081"
      - "9001:9001"
